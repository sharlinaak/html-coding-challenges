    <!-- 3-Column Bento Grid (Multi-Column Flexbox/Grid Requirement) -->
  <section class="bento-grid">
    <!-- Column 1: 2 stacked boxes -->
    <div class="bento-col">
      <div class="bento-box tall">Box 1</div>
      <div class="bento-box short">Box 2</div>
    </div>

    <!-- Column 2: 1 extra-tall box + 1 short box -->
    <div class="bento-col">
      <div class="bento-box extra-tall">Box 3</div>
      <div class="bento-box mini">Box 4</div>
    </div>

    <!-- Column 3: 3 stacked boxes -->
    <div class="bento-col">
      <div class="bento-box medium">Box 5</div>
      <div class="bento-box medium">Box 6</div>
      <div class="bento-box medium">Box 7</div>
    </div>
  </section>
